# CI for the GrowwithMH SEO repository.
#
# Runs exactly the gates used during development. Upstream OpenSEO's own
# workflows were removed when this repository was split out: they deploy to
# every-app's Cloudflare account, publish to ghcr.io/every-app, and upload
# source maps to a PostHog project — none of which exist here, so at this
# repository's root they would fail on every push.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - hostinger-webapp-test

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec oxlint src --type-aware

      - name: Format check
        run: pnpm exec prettier --check src

      - name: Test
        run: pnpm run test:ci

      # Also exercises the leanWorkerBundle guard, which fails if a denylisted
      # package re-enters the worker's eager startup graph.
      - name: Build
        run: pnpm run build
